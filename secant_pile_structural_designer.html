/* =====================================================================

   Steel W/HP shape cast in the reinforced (secondary) piles, strong-axis
   bending about the wall axis. Units: kip, in, ksi unless noted.
   AISC 360-22; ACI 318-19 Ch. 14 (structural plain concrete).
   ===================================================================== */
const SH_F = ['name', 'type', 'W', 'A', 'd', 'bf', 'tw', 'tf', 'kdes', 'Ix', 'Zx', 'Sx', 'rx', 'Iy', 'Zy', 'Sy', 'ry', 'J', 'Cw', 'h_tw', 'bf_2tf'];
const SHAPES = SHAPE_ROWS.map(r => { const o = {}; SH_F.forEach((k, i) => o[k] = r[i]); return o; });
const SHAPE_BY = new Map(SHAPES.map(s => [s.name, s]));

function shapeOf(I) {
  if (I.src !== 'custom') { const s = SHAPE_BY.get(I.shape); if (s) return Object.assign({ db: true }, s); }
  const s = { db: false, name: I.cName || 'Custom', type: 'Custom', d: I.cd, bf: I.cbf, tw: I.ctw, tf: I.ctf, A: I.cA, Ix: I.cIx, Sx: I.cSx, Zx: I.cZx, ry: I.cry, kdes: I.ctf };
  s.h_tw = (s.d - 2 * s.tf) / s.tw; s.bf_2tf = s.bf / (2 * s.tf); s.W = 3.4 * s.A;
  return s;
}

/* plastic neutral axis and plastic moment by fibres: circle of concrete (0.85 f'c in compression only)
   with an I-shape (flanges bf×tf, web tw×(d−2tf)) centred in it; strong axis bending, axial force P (+ compression) */
function plasticFibre(D, s, Fy, fc, P = 0, n = 1600) {
  const R = D / 2, dy = D / n, ys = [], wc = [], ws = [];
  for (let k = 0; k < n; k++) {
    const y = R - (k + 0.5) * dy, circ = 2 * Math.sqrt(Math.max(0, R * R - y * y));
    let st = 0; const ay = Math.abs(y);
    if (ay <= s.d / 2) st = ay >= s.d / 2 - s.tf ? s.bf : s.tw;

  <p class="note">The primary-pile cracking check is only required when αp > 0 (primary stiffness credited); with αp = 0 it is shown for information (Ms vs cracking moment). Reinforced-pile checks use per-pile demands (wall-designer per-ft result × b, b = ${f1(b, 3)} ft); per-ft equivalents shown for reference. Primary/plain rows are per ft of wall height. DCR = demand / design capacity.</p>`;
}
function renderSec(r) { $('#tab-sec').innerHTML = `<div class="card">${planFig(r).svg()}</div><div class="card" style="margin-top:12px">${sectionFig(r).svg()}</div>
  <h3>Design capacities</h3>${tbl(['Capacity', 'Per pile', 'Per ft of wall', 'Unit'], capRows(r).map(x => x.map(esc)))}`; }
function renderStf(r) { const c = r.crack; $('#tab-stf').innerHTML = `<div class="prose"><p>Average flexural stiffness over the repeat width b = ${f1(r.g.b, 1)} in. The design row feeds beam-on-springs / SSI wall models. C1 = ${r.C1.toFixed(3)} (AISC Eq. I2-7).</p><h3>Primary-pile stiffness factor αp</h3>${AP_TEXT.map(t => `<p>${esc(t)}</p>`).join('')}${c ? `<p><b>This wall:</b> Ms,pile = ${f1(c.Msp / 12, 0)} kip-ft vs cracking moment ${f1(c.Mcr / 12, 0)} kip-ft (with αp = ${f1(c.apU, 2)}) → ${c.cracks ? 'primary piles crack; use αp = 0' : 'primary piles uncracked; αp up to ' + f1(c.apU, 2) + ' admissible'}.</p>` : ''}</div>` +
  tbl(['Case', 'EI per ft, kip-in²/ft', 'EI, kip-ft²/ft', 'I in steel units, in⁴/ft', 'I in concrete units, in⁴/ft', 'Equivalent solid thickness, in'], r.stiff.map(x => [(x.design ? '<b>' : '') + esc(x.n) + (x.design ? '</b>' : ''), (x.EIft / 1e6).toFixed(3) + '×10⁶', f1(x.EIkft2, 0), f1(x.Is_ft, 0), f1(x.Ic_ft, 0), f1(x.teq, 1)])); }
function tbl(head, rows) { return `<div class="scroll"><table class="t"><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map(x => '<tr>' + x.map(c => `<td>${c}</td>`).join('') + '</tr>').join('')}</table></div>`; }
let derToken = 0;
async function renderDer(r) {
  const my = ++derToken, el = $('#tab-der'), B = calcBlocks(r), eqs = [];
  el.innerHTML = '<div class="prose">' + (window.MJ_STATE === 'failed' ? '<p>Equation typesetting did not load; showing plain text.</p>' : '') + B.map(b => {
    if (b.k === 'h') return `<h3>${esc(b.t)}</h3>`; if (b.k === 'p') return `<p>${esc(b.t)}</p>`;
    eqs.push(b.tex); return `<div class="eqr"><div class="m" data-i="${eqs.length - 1}"><span class="plain">${esc(texPlain(b.tex))}</span></div><span class="rf">${esc(b.ref)}</span></div>`;
  }).join('') + '</div>';
  if (window.MJ_STATE !== 'ready') return;
  for (const node of el.querySelectorAll('.m[data-i]')) { if (my !== derToken) return; try { const out = await MathJax.tex2svgPromise(eqs[+node.dataset.i], { display: true }); if (my !== derToken) return; node.replaceChildren(out); } catch (e) { } }
}
function renderRefs() { $('#tab-ref').innerHTML = `<div class="prose"><ol class="refs">${REFS.map(x => `<li>${esc(x)}</li>`).join('')}</ol><p>Shape properties: AISC Shapes Database v16.0 (${SHAPES.filter(x => x.type === 'W').length} W and ${SHAPES.filter(x => x.type === 'HP').length} HP shapes), embedded in this page.</p></div>`; }
function renderTab(t) { if (RES && t === 'der' && dirty.der) { dirty.der = false; renderDer(RES); } }
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-t]'); if (!b) return; TAB = b.dataset.t; document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x === b ? 'true' : 'false')); ['sec', 'der', 'stf', 'ref'].forEach(t => $('#tab-' + t).hidden = t !== TAB); renderTab(TAB); });
document.addEventListener('mj-ready', () => { if (TAB === 'der' && RES) renderDer(RES); else dirty.der = true; });
let dlCap;
function getDownloads() { if (dlCap !== undefined) return dlCap; dlCap = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null); return dlCap; }
async function saveFile(name, data, fallback) { const dl = await getDownloads(), note = $('#dlnote'); if (dl) { try { await dl.save({ filename: name, data }); note.textContent = 'Saved ' + name + '.'; } catch (e) { note.textContent = e && e.code === 'declined' ? 'Download cancelled.' : 'Downloads are unavailable in this view.'; } } else { fallback(); note.textContent = 'Saved ' + name + '.'; } }
async function mjReady(ms) { if (window.MJ_STATE === 'ready') return true; if (window.MJ_STATE === 'failed') return false; return new Promise(res => { const t = setTimeout(() => res(false), ms); document.addEventListener('mj-ready', () => { clearTimeout(t); res(window.MJ_STATE === 'ready'); }, { once: true }); }); }
$('#dl').addEventListener('click', async () => {
  if (!RES) return; const note = $('#dlnote'), btn = $('#dl');
  if (!window.jspdf) { note.textContent = 'PDF library did not load. Check the connection and reload.'; return; }
  btn.disabled = true; note.textContent = 'Typesetting equations…';
  try {
    const ok = await mjReady(12000);
    const tex2svg = ok ? async tex => { const n = await MathJax.tex2svgPromise(tex, { display: true }); const q = n.querySelector('svg'); return q ? q.outerHTML : null; } : null;
    note.textContent = 'Building report…';
    const doc = await buildPDF(RES, window.jspdf.jsPDF, tex2svg), name = ((RES.I.wall || 'secant-wall') + '_structural_calc.pdf').replace(/[^\w.-]+/g, '_');
    await saveFile(name, doc.output('blob'), () => doc.save(name));
    if (!ok) note.textContent += ' Equations shown as plain text (typesetting unavailable).';
  } catch (e) { note.textContent = 'Report failed: ' + e.message; }
  btn.disabled = false;
});
$('#exp').addEventListener('click', () => { const I = gather(), name = ((I.wall || 'secant-wall') + '_structural_inputs.json').replace(/[^\w.-]+/g, '_'), txt = JSON.stringify(I, null, 1); saveFile(name, txt, () => { const a = document.createElement('a'); a.href = 'data:application/json,' + encodeURIComponent(txt); a.download = name; a.click(); }); });
$('#imp').addEventListener('click', () => $('#impf').click());
$('#impf').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { applyInputs(JSON.parse(rd.result)); schedule(); $('#dlnote').textContent = 'Loaded ' + f.name + '.'; } catch (err) { $('#dlnote').textContent = 'That file is not a valid inputs file.'; } }; rd.readAsText(f); e.target.value = ''; });
renderInputs(); renderRefs();
try { const q = localStorage.getItem('spsd-inputs-v2'); if (q) applyInputs(JSON.parse(q)); } catch (e) { }
try { const q = localStorage.getItem('spsd-link'); if (q) LINK = JSON.parse(q); } catch (e) { }
renderLinkBar();
run();

</script>
</body>
