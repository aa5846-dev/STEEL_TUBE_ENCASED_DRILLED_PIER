<script>
/* =====================================================================
   Secant pile wall engine v2 — single brace (foundation slab), free-earth
   support about the brace. Units: ft, lb, psf, pcf. Elevation z (+ up).
   Primary reference: FHWA NHI-07-071 Earth Retaining Structures (2007).
   ===================================================================== */
const GW = 62.4, MEFP = 30;                      // pcf; FHWA §3.6.2 minimum equivalent fluid pressure
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;

/* ---- Log-spiral passive (Caquot–Kerisel via NAVFAC; FHWA Fig. 3-12) ----
   Vertical wall, level ground: Kp(φ,δ) = Kp,Rankine(φ) · R(φ,δ/φ) / R(φ,0),
   R = reduction factor of Kp(δ = −φ). Rows φ; columns −δ/φ = 0.7…0.0.     */
const LS_PHI = [10, 15, 20, 25, 30, 35, 40, 45];
const LS_RAT = [1.0, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1, 0.0];
const LS_R = [
  [1, .978, .962, .946, .929, .912, .898, .881, .864],
  [1, .961, .934, .907, .881, .854, .830, .803, .775],
  [1, .939, .901, .862, .824, .787, .752, .716, .678],
  [1, .912, .860, .808, .759, .711, .666, .620, .574],
  [1, .878, .811, .746, .686, .627, .574, .520, .467],
  [1, .836, .752, .674, .603, .536, .475, .417, .362],
  [1, .783, .682, .592, .512, .439, .375, .316, .262],
  [1, .718, .600, .500, .414, .339, .276, .221, .174]];
function lsR(phiDeg, ratio) {
  const rr = Math.min(1, Math.max(0, ratio));
  const rowAt = i => { // interpolate along δ/φ (descending table)
    const t = LS_R[i];
    for (let k = 0; k < LS_RAT.length - 1; k++) if (rr <= LS_RAT[k] && rr >= LS_RAT[k + 1]) { const f = (LS_RAT[k] - rr) / (LS_RAT[k] - LS_RAT[k + 1]); return t[k] + f * (t[k + 1] - t[k]); }
    return t[t.length - 1];
  };
  const p = Math.min(45, Math.max(0, phiDeg));
  if (p <= 10) { const r10 = rowAt(0); return 1 + (r10 - 1) * p / 10; } // R → 1 as φ → 0
  for (let i = 0; i < LS_PHI.length - 1; i++) if (p <= LS_PHI[i + 1]) { const f = (p - LS_PHI[i]) / (LS_PHI[i + 1] - LS_PHI[i]); return rowAt(i) + f * (rowAt(i + 1) - rowAt(i)); }
  return rowAt(LS_PHI.length - 1);
}
function kpLogSpiral(phi, dRatio) { // phi in rad; returns total (inclined) coefficient
  const kpr = Math.tan(Math.PI / 4 + phi / 2) ** 2;
  return kpr * lsR(deg(phi), dRatio) / lsR(deg(phi), 0);
}

/* ---- model ---- */
function buildModel(I) {
  const M = Object.assign({}, I);
  const L = I.layers.map(l => Object.assign({}, l)).sort((a, b) => b.bot - a.bot);
  L.forEach((l, i) => { l.botEff = i < L.length - 1 ? l.bot : -1e9; l.idx = i; });
  M.L = L; M.cache = new Map(); M.toe = I.ze; M.seep = false; M.H = I.zr - I.ze;
  M.bl = (I.bldg || []).filter(b => b.q > 0 && b.B > 0);
  M.slab = slabRes(M); M.Rslab = M.slab.R;
  M.LF = loadFactors(I);
  return M;
}
function loadFactors(I) {
  if (I.lfBasis === 'ACI') return { EH: 1.6, ES: 1.6, EB: 1.6, WA: 1.6, note: 'ACI 318-19 Table 5.3.1 / ASCE 7-22 §2.3: 1.6H (soil, water, surcharge and building loads treated as H)' };
  const EH = I.cond === 'atrest' ? 1.35 : (I.cond === 'aepSand' || I.cond === 'aepClay') ? 1.35 : 1.50;
  return { EH, ES: I.qType === 'LS' ? 1.75 : 1.50, EB: 1.50, WA: 1.00, note: 'AASHTO LRFD Strength I (FHWA Tables 4-1, 4-2): EH ' + (I.cond === 'atrest' ? 'at-rest 1.35' : EH === 1.35 ? 'apparent (AEP) 1.35' : 'active 1.50') + ', uniform q ' + (I.qType === 'LS' ? 'LS 1.75' : 'ES 1.50') + ', building (Boussinesq) ES 1.50, WA 1.00' };
}
function layerAt(M, z) { const L = M.L; for (let i = 0; i < L.length; i++) if (z > L[i].botEff) return i; return L.length - 1; }

function soilP(M, i, Fs) {
  const key = i + '|' + Fs; let p = M.cache.get(key); if (p) return p;
  const l = M.L[i];
  const phi = Math.atan(Math.tan(rad(l.phi)) / Fs), c = (l.c || 0) / Fs, su = (l.su || 0) / Fs;
  const dA = phi * (M.dA || 0), dP = phi * (M.dP || 0);
  const KaR = Math.tan(Math.PI / 4 - phi / 2) ** 2, KpR = Math.tan(Math.PI / 4 + phi / 2) ** 2;
  let Ka = KaR, Kp = KpR;
  if (M.thA === 'coulomb') { const s = Math.sqrt(Math.sin(phi + dA) * Math.sin(phi) / Math.cos(dA)); Ka = Math.cos(phi) ** 2 / (1 + s) ** 2; }
  if (M.thP === 'coulomb') { const s = Math.sqrt(Math.sin(phi + dP) * Math.sin(phi) / Math.cos(dP)); Kp = Math.cos(phi) ** 2 / Math.max(1 - s, 0.02) ** 2; }
  else if (M.thP === 'logspiral') Kp = kpLogSpiral(phi, M.dP || 0) * Math.cos(dP);
  const K0 = (1 - Math.sin(phi)) * Math.pow(Math.max(1, l.ocr || 1), Math.sin(phi));
  p = { phi: deg(phi), c, su, dA: deg(dA), dP: deg(dP), Ka, Kp, K0, KaR, KpR, sKa: Math.sqrt(Ka), sKp: Math.sqrt(Kp), U: l.type === 'U' };
  M.cache.set(key, p); return p;
}

/* ---- pore pressure: hydrostatic or linear head loss around toe (FHWA Eq. 3-33, Fig. 3-22) ---- */
function seepParams(M, toe) {
  const zE = Math.min(M.wte, M.ze);
  if (M.wtr > toe && zE > toe && M.wtr > M.wte) { const Lf = (M.wtr - toe) + (zE - toe); return { ok: true, zE, Lf, i: (M.wtr - M.wte) / Lf }; }
  return { ok: false };
}
function setToe(M, toe) {
  M.toe = toe; const s = seepParams(M, toe);
  M.seep = M.water === 'seep' && s.ok; if (M.seep) { M.zE = s.zE; M.Lf = s.Lf; M.i = s.i; }
}
function uR(M, z) { if (z >= M.wtr) return 0; return M.seep ? GW * (M.wtr - z) * (1 - M.i) : GW * (M.wtr - z); }
function uE(M, z) {
  if (z >= M.wte) return 0;
  if (M.seep && z <= M.zE) { const s = (M.wtr - M.toe) + (z - M.toe); return Math.max(0, GW * (M.wtr - M.i * s - z)); }
  return GW * (M.wte - z);
}
function sigmaTot(M, zs, z, wt, q0) {
  if (z >= zs) return q0;
  const b = [zs, z]; for (const l of M.L) if (l.botEff < zs && l.botEff > z) b.push(l.botEff);
  if (wt < zs && wt > z) b.push(wt);
  b.sort((x, y) => y - x);
  let s = q0;
  for (let k = 0; k < b.length - 1; k++) { const a = b[k], c = b[k + 1]; if (a - c <= 0) continue; const mid = (a + c) / 2, l = M.L[layerAt(M, mid)]; s += (mid < wt ? l.gs : l.gm) * (a - c); }
  return s;
}

/* ---- apparent earth pressure (FHWA Figs. 8-67, 8-68), above excavation grade ---- */
function aepSetup(M) {
  const H = M.H; if (H <= 0) return null;
  const H1 = Math.min(H, Math.max(0, M.zr - M.zb));
  let p, load;
  if (M.cond === 'aepSand') {
    // total load = 0.65 Ka γ' H² = 1.3 × Rankine active resultant over H  (layered generalisation)
    const n = 200, dz = H / n; let Pa = 0;
    for (let k = 0; k < n; k++) { const z = M.zr - (k + 0.5) * dz, P = soilP(M, layerAt(M, z), 1); const sv = Math.max(0, sigmaTot(M, M.zr, z, M.wtr, 0) - uR0(M, z)); Pa += Math.max(0, P.KaR * sv - 2 * P.c * Math.sqrt(P.KaR)) * dz; }
    load = 1.3 * Pa; p = load / (2 * H / 3);
  } else {
    const gbar = sigmaTot(M, M.zr, M.ze, M.wtr, 0) / H; p = M.aepC * gbar * H; load = p * 2 * H / 3;
  }
  return { H, H1, p, load };
}
function uR0(M, z) { return z >= M.wtr ? 0 : GW * (M.wtr - z); }
function aepOrd(A, d) { // d = depth below retained grade
  if (!A || d < 0 || d > A.H) return 0;
  const a = 2 / 3 * A.H1, b = a + A.H / 3;
  if (d < a) return a > 0 ? A.p * d / a : A.p;
  if (d <= b) return A.p;
  const c = A.H - b; return c > 1e-9 ? A.p * (A.H - d) / c : A.p;
}

/* ---- lateral pressures (earth part = total − u; totals clipped ≥ 0) ---- */
function drive(M, z, Fs, qOn) { // retained side, driving state; returns earth-equivalent (psf)
  if (z >= M.zr) return 0;
  const P = soilP(M, layerAt(M, z), Fs), q = qOn ? M.q : 0;
  const sv = sigmaTot(M, M.zr, z, M.wtr, q), u = uR(M, z), svp = Math.max(0, sv - u);
  const act = () => P.U ? Math.max(0, sv - 2 * P.su) - u : Math.max(0, P.Ka * svp - 2 * P.c * P.sKa);
  const rest = () => P.K0 * svp;
  let e;
  if (M.cond === 'active') e = act();
  else if (M.cond === 'atrest') e = rest();
  else if (M.cond === 'avg') e = 0.5 * (act() + rest());
  else { // AEP above excavation grade, theoretical active below
    if (z >= M.ze) e = aepOrd(M.aep, M.zr - z) + P.KaR * q;
    else e = act();
  }
  if (M.mefp && M.cond !== 'atrest') e = Math.max(e, MEFP * (M.zr - z) - u);
  return e;
}
/* ---- building surcharges: Boussinesq strip load on a non-yielding wall (AASHTO Eq. 3.11.6.2-1; FHWA §3.7) ----
   Δp_h = (2Q/π)[β − sin β cos(β + 2θ1)], θ1 = atan(x1/d), θ2 = atan((x1+B)/d), β = θ2 − θ1, d = z_f − z.
   The factor 2 is the elastic half-space solution doubled for a rigid (non-yielding) wall.            */
function bousOne(b, z) {
  const d = b.zf - z; if (d <= 1e-9 || !(b.q > 0) || !(b.B > 0)) return 0;
  const t1 = Math.atan(Math.max(0, b.x) / d), t2 = Math.atan((Math.max(0, b.x) + b.B) / d), be = t2 - t1;
  return 2 * b.q / Math.PI * (be - Math.sin(be) * Math.cos(be + 2 * t1));

 let h = '<tr>' + LC.map(c => `<th>${c[1]}${c[4] ? `<br><span class="u">${c[4]}</span>` : ''}</th>`).join('') + '<th></th></tr>';
 LAYERS.forEach((l, i) => {
  h += '<tr>' + LC.map(c => {
   if (c[0] === 'bot' && i === LAYERS.length - 1) return `<td class="inf">∞</td>`;
   const al = `aria-label="Layer ${i + 1} ${c[1]}" data-l="${i}" data-k="${c[0]}" style="width:${c[3]}px"`;
   if (c[2] === 'sel') return `<td><select ${al}><option value="D"${l.type !== 'U' ? ' selected' : ''}>D</option><option value="U"${l.type === 'U' ? ' selected' : ''}>U</option></select></td>`;
   const dis = (c[0] === 'su' && l.type !== 'U') || (c[0] === 'c' && l.type === 'U') ? ' disabled' : '';
   return `<td><input ${al} ${c[2] === 'n' ? 'type="number" step="any" inputmode="decimal"' : 'type="text"'} value="${esc(l[c[0]] ?? '')}"${dis}></td>`;
  }).join('') + `<td>${LAYERS.length > 1 ? `<button class="rm" type="button" data-rm="${i}" aria-label="Remove layer ${i + 1}">×</button>` : ''}</td></tr>`;
 });
 const t = $('#lt'); t.innerHTML = h;
 t.querySelectorAll('input,select').forEach(el => el.addEventListener('input', () => { const l = LAYERS[+el.dataset.l], k = el.dataset.k; l[k] = (k === 'name' || k === 'type') ? el.value : parseFloat(el.value); if (k === 'type') renderLayers(); }));
 t.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { LAYERS.splice(+b.dataset.rm, 1); renderLayers(); schedule(); });
}
function gather() {
 const I = {};
 for (const g of SCHEMA) for (const f of g.f) { const el = $('#' + f.id); I[f.id] = f.t === 'chk' ? el.checked : f.t ? el.value : parseFloat(el.value); }
 I.layers = LAYERS.map(l => Object.assign({}, l));
 I.bldg = BLOADS.map(b => Object.assign({}, b));
 return I;
}
function applyInputs(I) {
 for (const g of SCHEMA) for (const f of g.f) if (I[f.id] !== undefined) { const el = $('#' + f.id); if (f.t === 'chk') el.checked = !!I[f.id]; else el.value = I[f.id]; }
 if (Array.isArray(I.layers) && I.layers.length) LAYERS = I.layers.map(l => Object.assign({ type: 'D', su: 0, ocr: 1, c: 0 }, l));
 if (Array.isArray(I.bldg)) BLOADS = I.bldg.map(b => Object.assign({}, b));
 renderLayers(); renderBldg();
}
function syncDeps(I) {
 document.querySelectorAll('[data-dep]').forEach(r => { const d = JSON.parse(r.dataset.dep); r.hidden = !d.slice(1).includes(I[d[0]]); });
 for (const k in HELP) { const el = $('#h-' + k); if (el) el.textContent = HELP[k][I[k]] || ''; }
}
function numsOk(I) {
 const bad = [];
 for (const g of SCHEMA) for (const f of g.f) if (!f.t && !isFinite(I[f.id])) bad.push(f.l);
 I.layers.forEach((l, i) => LC.forEach(c => { if (c[2] !== 'n' || (c[0] === 'bot' && i === I.layers.length - 1)) return; if ((c[0] === 'su' && l.type !== 'U') || (c[0] === 'c' && l.type === 'U')) return; if (!isFinite(l[c[0]])) bad.push(`Layer ${i + 1} ${c[1]}`); }));
 I.bldg.forEach((b, i) => BC.forEach(c => { if (c[2] === 'n' && !isFinite(b[c[0]])) bad.push(`Building load ${i + 1} ${c[1]}`); }));
 return bad;
}
let timer = null, RES = null, TAB = 'sec', dirty = { der: true, calc: true, plan: true };
function schedule() { clearTimeout(timer); $('#main').classList.add('busy'); timer = setTimeout(run, 220); }
const pill = s => `<span class="pill ${s}">${s === 'ok' ? 'OK' : s === 'ng' ? 'NG' : 'N/A'}</span>`;

function run() {
 const I = gather();
 syncDeps(I);
 I.layers.forEach(l => { if (l.type !== 'U') l.su = 0; else l.c = 0; if (!isFinite(l.ocr)) l.ocr = 1; });
 try { localStorage.setItem('spw-inputs-v2', JSON.stringify(I)); } catch (e) { }
 const bad = numsOk(I), msgs = $('#msgs');
 $('#main').classList.remove('busy');
 if (bad.length) { RES = null; msgs.innerHTML = `<li>Enter a number for: ${bad.map(esc).join(', ')}.</li>`; $('#dl').disabled = true; return; }
 let res;
 try { res = design(I); } catch (e) { RES = null; msgs.innerHTML = `<li>Calculation stopped: ${esc(e.message)}. Check the inputs.</li>`; $('#dl').disabled = true; return; }
 msgs.innerHTML = (res.errors || []).map(e => `<li>${esc(e)}</li>`).join('') + (res.warnings || []).map(w => `<li class="w">${esc(w)}</li>`).join('');
 if (res.errors && res.errors.length) { RES = null; $('#dl').disabled = true; $('#summary').innerHTML = ''; ['sec', 'der', 'calc', 'plan'].forEach(t => $('#tab-' + t).innerHTML = ''); return; }
 RES = res; $('#dl').disabled = false; dirty = { der: true, calc: true, plan: true };
 renderSummary(res); renderSection(res); renderTab(TAB);
}
function renderSummary(r) {
 const ck = checksList(r);
 const rows = ck.map(c => c.na ? `<tr><td>${esc(c.n)}</td><td>—</td><td>—</td><td>—</td><td>—</td><td>${pill('na')}</td><td class="ref">${esc(c.na)}</td></tr>`
  : `<tr><td>${esc(c.n)}<br><span class="note">${esc(c.dn)} vs ${esc(c.cn)}</span></td><td>${fmtV(c.dem, c.u === '-' ? 3 : 2)}</td><td>${fmtV(c.cap, c.u === '-' ? 3 : 2)}</td><td class="l">${c.u === '-' ? '–' : esc(c.u)}</td><td>${isNaN(c.fs) ? '—' : fmtV(c.fs) + ' / ' + fmtV(c.req)}</td><td><b>${c.dcr.toFixed(2)}</b> ${pill(c.ok ? 'ok' : 'ng')}</td><td class="ref">${esc(c.ref)}</td></tr>`).join('');
 const S = r.S, F = r.F;
 $('#summary').innerHTML = `
 <div class="big">
  <div><b>${f1(r.Dd, 2)} ft</b><span>Embedment below excavation</span></div>
  <div><b>EL ${f1(r.toe, 2)}</b><span>Pile toe · length ${f1(r.len, 2)} ft</span></div>
  <div><b>${f1(r.per.Mu, 0)} k-ft</b><span>Mu per reinforced pile</span></div>
  <div><b>${f1(r.per.Ru, 1)} k/ft</b><span>Factored slab reaction</span></div>
 </div>
 <div class="sum">
  <div class="scroll"><table class="t"><tr><th>Check</th><th>Demand</th><th>Capacity</th><th class="l">Unit</th><th>FS prov. / req.</th><th>DCR</th><th class="l">Basis</th></tr>${rows}</table><p class="note">DCR = FS required / FS provided (LRFD: factored demand / factored resistance); ≤ 1.00 passes.</p></div>
  <div class="scroll"><table class="t"><tr><th>Structural demand</th><th>Service</th><th>Factored</th></tr>
   <tr><td>Slab reaction, kip/ft</td><td>${f1(r.svc.R / 1000, 2)}</td><td>${f1(r.fac.R / 1000, 2)}</td></tr>
   <tr><td>Max moment, kip-ft/ft</td><td>${f1(S.Mmax / 1000, 1)}</td><td>${f1(F.Mmax / 1000, 1)}</td></tr>
   <tr><td>Max shear, kip/ft</td><td>${f1(Math.abs(S.Vmax) / 1000, 2)}</td><td>${f1(Math.abs(F.Vmax) / 1000, 2)}</td></tr>
   <tr class="g"><td>Per reinforced pile, b = ${f1(r.geom.b_ft, 2)} ft</td><td>M ${f1(r.per.M, 0)} · V ${f1(r.per.V, 0)}</td><td>Mu ${f1(r.per.Mu, 0)} · Vu ${f1(r.per.Vu, 0)}</td></tr>
   <tr><td>Governing mechanism</td><td colspan="2">${r.mode === 'A' ? 'A — toe toward excavation' : 'B — toe into retained soil'}</td></tr>
   ${r.hinge ? `<tr><td>FHWA hinge / tributary brace load</td><td colspan="2">${f1(r.hinge.T / 1000, 2)} / ${f1(r.hinge.Tt / 1000, 2)} k/ft</td></tr>` : ''}
   <tr><td>Rowe flexibility, log ρ</td><td colspan="2">${f1(r.geom.logrho, 2)}</td></tr>
  </table><p class="note">${esc(r.LF.note)}.</p></div>
 </div>`;
}
function renderSection(r) {
 $('#tab-sec').innerHTML = `<div class="card">${sectionFig(r).svg()}</div>
 <p class="note">Service pressures per foot of wall at the design embedment. Dashed green is available passive; solid green is the mobilised part (λ = ${r.svc.lam.toFixed(3)}) that balances moments about the slab. Shear and moment: service solid, factored dashed.</p>`;
}
function renderPlan(r) {
 const I = r.I;
 $('#tab-plan').innerHTML = `<div class="card">${planFig(r).svg()}</div>
 <div class="scroll"><table class="t" style="margin-top:14px;max-width:640px"><tr><th>Secant geometry and stiffness</th><th>Value</th></tr>
 <tr><td>Diameter d / spacing s</td><td>${f1(I.dia, 1)} in / ${f1(I.sp, 1)} in</td></tr>
 <tr><td>Overlap d − s</td><td>${f1(r.geom.ov, 2)} in</td></tr>
 <tr><td>Wall thickness at interlock, 2√(r² − (s/2)²)</td><td>${f1(r.geom.t_in, 2)} in</td></tr>
 <tr><td>Tributary width per reinforced pile (FHWA §8.12.4.2)</td><td>${f1(r.geom.b_ft, 3)} ft</td></tr>
 <tr><td>Ec = 57000√f′c</td><td>${f1(r.geom.Ec / 1000, 0)} ksi</td></tr>
 <tr><td>Ie = (Ie/Ig)·πd⁴/64 per reinforced pile</td><td>${f1(r.geom.Ie, 0)} in⁴</td></tr>
 <tr><td>Rowe flexibility ρ, log ρ (FHWA Fig. 8-60a)</td><td>${r.geom.rho.toExponential(2)}, ${f1(r.geom.logrho, 2)}</td></tr></table></div>`;
}
function tbl(head, rows, cls) { return `<div class="scroll"><table class="t">${'<tr>' + head.map((h, i) => `<th${cls && cls[i] ? ` class="${cls[i]}"` : ''}>${h}</th>`).join('') + '</tr>'}${rows.map(r => '<tr>' + r.map((c, i) => `<td${cls && cls[i] ? ` class="${cls[i]}"` : ''}>${c}</td>`).join('') + '</tr>').join('')}</table></div>`; }
function renderCalc(r) {
 const I = r.I;
 let h = '<h3>Earth-pressure coefficients</h3>';
 const ch = ['Layer', 'Type', 'φ′', 'Ka', 'Kp', 'K0', 'Ka Rankine']; if (I.meth === 'Fs') ch.push('φ′d', 'Ka,d', 'Kp,d');
 h += tbl(ch, r.coef.map(c => { const x = [esc(c.l.name), c.l.type === 'U' ? 'U' : 'D', f1(c.u.phi, 1) + '°', c.u.Ka.toFixed(3), c.u.Kp.toFixed(3), c.u.K0.toFixed(3), c.u.KaR.toFixed(3)]; if (c.f) x.push(f1(c.f.phi, 2) + '°', c.f.Ka.toFixed(3), c.f.Kp.toFixed(3)); return x; }));
 h += '<h3>Pressures at key elevations (service, psf)</h3>';
 const kh = ['Point', 'EL ft', 'Layer', 'σv', 'u behind', 'σ′v', 'pd soil', 'Δp from q', 'Δp bldg', 'p total', 'p total + u', 'u front', 'σv front', 'pp front'];
 if (r.mode === 'B') kh.push('pp behind', 'pa front');
 h += tbl(kh, r.rows.map(x => { const a = [esc(x.t), f1(x.z, 2), esc(x.layer), f1(x.sv, 0), f1(x.ur, 0), f1(x.svp, 0), f1(x.sSoil, 0), f1(x.sQ, 0), f1(x.sB, 0), f1(x.sDrive, 0), f1(x.tot, 0), f1(x.ue, 0), f1(x.svE, 0), f1(x.pE, 0)]; if (r.mode === 'B') a.push(f1(x.pR, 0), f1(x.aE, 0)); return a; }));
 if (r.bld.length) { h += '<h3>Building surcharges, Boussinesq (service)</h3>'; h += tbl(['Load', 'Q psf', 'x1 ft', 'B ft', 'Base EL ft', 'Ph kip/ft', 'Centroid EL ft', 'Δph,max psf', 'at EL ft'], r.bld.map(b => [esc(b.b.name || ''), f1(b.b.q, 0), f1(b.b.x, 1), f1(b.b.B, 1), f1(b.b.zf, 2), fk(b.P, 2), f1(b.zc, 2), f1(b.pmax, 0), f1(b.zmax, 2)])); }
 h += `<h3>Resultants about the slab (mode ${r.mode}, service)</h3>`;
 h += tbl(['Component', 'F kip/ft', 'Centroid EL ft', 'Arm ft', 'M kip-ft/ft'], r.compTab.map(c => [esc(c.name), fk(c.F, 3), f1(c.zc, 2), f1(I.zb - c.zc, 2), fk(c.Mo, 2)]));
 h += '<h3>Embedment and factors</h3>';
 h += tbl(['Quantity', 'Value'], [
  ['Mode A factor (unfactored MR/MO)', isFinite(r.g1A) ? r.g1A.toFixed(3) : 'no mechanism'], ['Mode B factor (unfactored MR/MO)', isFinite(r.g1B) ? r.g1B.toFixed(3) : 'no mechanism'],
  ['Provided, in the selected method', f1(r.prov, 3)], ['D for rotation / sliding', f1(r.Dot, 3) + ' / ' + f1(r.Dsl, 3) + ' ft'], ['Design D, toe EL', f1(r.Dd, 2) + ' ft, EL ' + f1(r.toe, 2)],
  ['Overturning moment MO / resisting moment MR (service)', fk(r.ot.MO, 2) + ' / ' + fk(r.ot.MR, 2) + ' kip-ft/ft'],
  ['Slab friction: N (self-weight − uplift) / R_slab, on ' + esc(r.slab.layer), fk(r.slab.N, 2) + ' / ' + fk(r.slab.R, 2) + ' kip/ft' + (r.slab.U_ ? ' (min(su·Bs, N/2))' : ' (μ = ' + r.slab.mu.toFixed(3) + ')')],
  ['Sliding force / sliding resistance (Pp + R_slab)', fk(r.sl.Fd, 2) + ' / ' + fk(r.sl.Pp + r.slab.R, 2) + ' kip/ft'],
  ['λ service / factored', r.svc.lam.toFixed(4) + ' / ' + r.fac.lam.toFixed(4)],
  ...(r.aep ? [['Apparent pressure ordinate p, H1', f1(r.aep.p, 0) + ' psf, ' + f1(r.aep.H1, 2) + ' ft']] : []),
  ...(r.basal.applicable ? [['Basal heave: Nc, block width, FS, Ns', `${r.basal.Nc.toFixed(2)}, ${isFinite(r.basal.Bp) ? f1(r.basal.Bp, 1) + ' ft (stiff stratum)' : 'unbounded (one-sided wall)'}, ${f1(r.basal.FS, 2)}, ${f1(r.basal.Ns, 2)}`]] : []),
  ...(r.hyd.applicable ? [['Hydraulic: i, icr, FS', `${r.hyd.i.toFixed(3)}, ${r.hyd.icr.toFixed(3)}, ${f1(r.hyd.FS, 2)}`]] : [])]);
 $('#tab-calc').innerHTML = h;
}
let derToken = 0;
async function renderDer(r) {
 const my = ++derToken, el = $('#tab-der');
 const B = calcBlocks(r);
 const eqs = [];
 el.innerHTML = '<div class="prose">' + (window.MJ_STATE === 'failed' ? '<p>Equation typesetting did not load; showing plain text.</p>' : '') + B.map(b => {
  if (b.k === 'h') return `<h3>${esc(b.t)}</h3>`;
  if (b.k === 'p') return `<p>${esc(b.t)}</p>`;
  eqs.push(b.tex); return `<div class="eqr"><div class="m" data-i="${eqs.length - 1}"><span class="plain">${esc(texPlain(b.tex))}</span></div><span class="rf">${esc(b.ref)}</span></div>`;
 }).join('') + '</div>';
 if (window.MJ_STATE !== 'ready') return;
 for (const node of el.querySelectorAll('.m[data-i]')) {
  if (my !== derToken) return;
  try { const out = await MathJax.tex2svgPromise(eqs[+node.dataset.i], { display: true }); if (my !== derToken) return; node.replaceChildren(out); } catch (e) { }
 }
}
function renderGuide() {
 $('#tab-guide').innerHTML = '<div class="prose"><p>Each option below changes a specific term in the derivation. Use cases follow FHWA NHI-07-071 guidance; numbers in brackets refer to the References tab.</p></div>' +
  tbl(['Group', 'Option', 'Definition', 'Use when', 'Ref.'], OPTS.map(o => o.map(esc)), ['l', 'l', 'l', 'l', 'l']);
}
function renderRefs() { $('#tab-ref').innerHTML = `<div class="prose"><ol class="refs">${REFS.map(x => `<li>${esc(x)}</li>`).join('')}</ol><p>Figure, table and equation numbers refer to FHWA NHI-07-071 (December 2007) unless noted.</p></div>`; }
function renderTab(t) {
 if (!RES) return;
 if (t === 'der' && dirty.der) { dirty.der = false; renderDer(RES); }
 if (t === 'calc' && dirty.calc) { dirty.calc = false; renderCalc(RES); }
 if (t === 'plan' && dirty.plan) { dirty.plan = false; renderPlan(RES); }
}
$('#tabs').addEventListener('click', e => {
 const b = e.target.closest('button[data-t]'); if (!b) return; TAB = b.dataset.t;
 document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x === b ? 'true' : 'false'));
 ['sec', 'der', 'calc', 'plan', 'guide', 'ref'].forEach(t => $('#tab-' + t).hidden = t !== TAB);
 renderTab(TAB);
});
document.addEventListener('mj-ready', () => { if (TAB === 'der' && RES) renderDer(RES); else dirty.der = true; });

/* ---- downloads ---- */
let dlCap;
function getDownloads() {
 if (dlCap !== undefined) return dlCap;
 dlCap = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
 return dlCap;
}
async function saveFile(name, data, fallback) {
 const dl = await getDownloads(), note = $('#dlnote');
 if (dl) {
  try { await dl.save({ filename: name, data }); note.textContent = 'Saved ' + name + '.'; }
  catch (e) { note.textContent = e && e.code === 'declined' ? 'Download cancelled.' : e && e.code === 'rate_limited' ? 'A save prompt is already open.' : 'Downloads are unavailable in this view.'; }
 } else { fallback(); note.textContent = 'Saved ' + name + '.'; }
}
async function mjReady(ms) {
 if (window.MJ_STATE === 'ready') return true; if (window.MJ_STATE === 'failed') return false;
 return new Promise(res => { const t = setTimeout(() => res(false), ms); document.addEventListener('mj-ready', () => { clearTimeout(t); res(window.MJ_STATE === 'ready'); }, { once: true }); });
}
$('#dl').addEventListener('click', async () => {
 if (!RES) return; const note = $('#dlnote'), btn = $('#dl');
 if (!window.jspdf) { note.textContent = 'PDF library did not load. Check the connection and reload.'; return; }
 btn.disabled = true; note.textContent = 'Typesetting equations…';
 try {
  const ok = await mjReady(12000);
  const tex2svg = ok ? async tex => { const n = await MathJax.tex2svgPromise(tex, { display: true }); const s = n.querySelector('svg'); return s ? s.outerHTML : null; } : null;
  note.textContent = 'Building report…';
  const doc = await buildPDF(RES, window.jspdf.jsPDF, tex2svg);
  const name = ((RES.I.wall || 'secant-wall') + '_design_report.pdf').replace(/[^\w.-]+/g, '_');
  await saveFile(name, doc.output('blob'), () => doc.save(name));
  if (!ok) note.textContent += ' Equations shown as plain text (typesetting unavailable).';
 } catch (e) { note.textContent = 'Report failed: ' + e.message; }
 btn.disabled = false;
});
$('#exp').addEventListener('click', () => { const I = gather(); const name = ((I.wall || 'secant-wall') + '_inputs.json').replace(/[^\w.-]+/g, '_'); const txt = JSON.stringify(I, null, 1); saveFile(name, txt, () => { const a = document.createElement('a'); a.href = 'data:application/json,' + encodeURIComponent(txt); a.download = name; a.click(); }); });
$('#imp').addEventListener('click', () => $('#impf').click());
$('#impf').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { applyInputs(JSON.parse(rd.result)); schedule(); $('#dlnote').textContent = 'Loaded ' + f.name + '.'; } catch (err) { $('#dlnote').textContent = 'That file is not a valid inputs file.'; } }; rd.readAsText(f); e.target.value = ''; });

renderInputs(); renderGuide(); renderRefs();
try { const s = localStorage.getItem('spw-inputs-v2'); if (s) applyInputs(JSON.parse(s)); } catch (e) { }
run();
</script>
</body>
